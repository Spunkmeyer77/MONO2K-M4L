name: build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Engine test (Live at 48 kHz, clock sync, save and reload)
        run: |
          gcc -O2 -w -Icore/src -Icore/gen -Iexternal/mono2k~ -o engine_test tests/engine_test.c \
            external/mono2k~/m2k_engine.c external/mono2k~/m2k_core_glue.c -lm
          ./engine_test demo.wav

  mac:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Max SDK
        run: git clone --depth 1 https://github.com/Cycling74/max-sdk-base external/max-sdk-base
      - name: Build (universal, macOS 10.13+)
        run: |
          cmake -S external/mono2k~ -B build-mac -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-mac --config Release
      - name: Check architectures and minimum macOS (must run on macOS 12 Monterey)
        run: |
          N="mono2k_$(tr -d '.\n' < VERSION)~"
          BIN="build/externals/$N.mxo/Contents/MacOS/$N"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64 && lipo -info "$BIN" | grep -q x86_64
          for a in arm64 x86_64; do
            # (LC_BUILD_VERSION's minos, or LC_VERSION_MIN_MACOSX's version below 10.14)
            M=$(otool -arch $a -l "$BIN" | awk '/LC_BUILD_VERSION/{b=1} /LC_VERSION_MIN_MACOSX/{v=1} b&&/minos/{print $2; exit} v&&/ version/{print $2; exit}')
            [ -n "$M" ] || { echo "no minimum macOS found for $a"; exit 1; }
            echo "$a minos $M"
            python3 -c "import sys; v=tuple(int(x) for x in '$M'.split('.')); sys.exit(0 if v <= (11,0) else 1)" \
              || { echo "minimum macOS $M is newer than 11.0"; exit 1; }
          done
      - name: Package
        run: |
          N="mono2k_$(tr -d '.\n' < VERSION)~"
          cd build/externals && ditto -c -k --keepParent "$N.mxo" ../../mono2k-mac.zip
      - uses: actions/upload-artifact@v5
        with: { name: mono2k-mac, path: mono2k-mac.zip }

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Max SDK
        run: git clone --depth 1 https://github.com/Cycling74/max-sdk-base external/max-sdk-base
      - name: Build (x64, clang-cl)
        run: |
          cmake -S external/mono2k~ -B build-win -G "Visual Studio 17 2022" -A x64 -T ClangCL
          cmake --build build-win --config Release
      - name: Package
        shell: pwsh
        run: |
          $d = (Get-Content VERSION).Trim() -replace '\.', ''
          Compress-Archive -Path "build/externals/mono2k_$d~.mxe64" -DestinationPath mono2k-win.zip
      - uses: actions/upload-artifact@v5
        with: { name: mono2k-win, path: mono2k-win.zip }

  release:
    # a tag's push, or a push to main whose VERSION has no release yet: published by the build itself
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '\n' < VERSION)"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.ver.outputs.go == '1'
        with: { path: dl }
      - name: Bundle
        if: steps.ver.outputs.go == '1'
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p "MONO2K-$V"
          D="$(echo "$V" | tr -d .)"
          cp device/MONO2K.amxd "MONO2K-$V/"
          cp device/mono2k_panel.js "MONO2K-$V/mono2k_panel_$D.js"
          cp device/mono2k_panel.js "mono2k_panel_$D.js"
          cp device/mono2k_screen.js "MONO2K-$V/mono2k_screen_$D.js"
          cp device/mono2k_screen.js "mono2k_screen_$D.js"
          cp docs/*.pdf "MONO2K-$V/" 2>/dev/null || true
          (cd "MONO2K-$V" && unzip -q ../dl/mono2k-mac/mono2k-mac.zip && unzip -q ../dl/mono2k-win/mono2k-win.zip)
          cp LICENSE "MONO2K-$V/LICENSE.txt"
          zip -qr "MONO2K-$V-all.zip" "MONO2K-$V"
          cp dl/mono2k-mac/mono2k-mac.zip "mono2k-external-$V-mac.zip"
          cp dl/mono2k-win/mono2k-win.zip "mono2k-external-$V-win.zip"
          cp device/MONO2K.amxd "MONO2K-$V-unfrozen.amxd"
      - name: Notes
        if: steps.ver.outputs.go == '1'
        run: |
          V="${{ steps.ver.outputs.v }}"
          # this version's lines from the update history's source
          python3 - "$V" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          s = open("docs/NOTES.md").read()
          m = re.search(r"^## " + re.escape(v) + r"\n(.*?)(?=^## |\Z)", s, re.S | re.M)
          print("MONO2K for Max for Live " + v + "\n\n" + (m.group(1).strip() if m else ""))
          PY
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.go == '1'
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: MONO2K for Max for Live v${{ steps.ver.outputs.v }}
          body_path: notes.md
          files: |
            MONO2K-*-all.zip
            mono2k-external-*-mac.zip
            mono2k-external-*-win.zip
            MONO2K-*-unfrozen.amxd
            mono2k_panel_*.js
            mono2k_screen_*.js
            docs/*.pdf
